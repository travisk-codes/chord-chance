<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0ece3"/>
      <stop offset="100%" stop-color="#d8d3c8"/>
    </linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a2a33"/>
      <stop offset="100%" stop-color="#13131a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d0d0f"/>

  <!-- White keys: C, D, E -->
  <rect x="88"  y="108" width="108" height="298" rx="10" fill="url(#wk)" stroke="#b8b3a8" stroke-width="1"/>
  <rect x="202" y="108" width="108" height="298" rx="10" fill="url(#wk)" stroke="#b8b3a8" stroke-width="1"/>
  <rect x="316" y="108" width="108" height="298" rx="10" fill="url(#wk)" stroke="#b8b3a8" stroke-width="1"/>

  <!-- Black keys: C#, D# -->
  <rect x="164" y="108" width="72" height="190" rx="8" fill="url(#bk)"/>
  <rect x="278" y="108" width="72" height="190" rx="8" fill="url(#bk)"/>
</svg>
