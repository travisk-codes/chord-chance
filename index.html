<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="glow-orb"></div>

<header>
  <div class="logo">Chord Chance</div>
  <div class="header-right">
    <div class="mode-pill">
      <button class="mode-btn active" data-mode="note">Note</button>
      <button class="mode-btn" data-mode="chord">Chord</button>
    </div>
    <div class="settings-btn" id="settingsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
  </div>
</header>

<div class="stage">
  <div class="label" id="modeLabel">Note</div>
  <div class="display-wrap">
    <div class="note-display flash-in" id="noteDisplay">C</div>
  </div>
  <div class="chord-quality" id="chordQuality"></div>
  <div class="feedback-label" id="feedbackLabel"></div>
</div>

<div class="controls">
  <div class="ctrl-btn" id="prevBtn" title="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </div>
  <div class="ctrl-btn primary" id="playPauseBtn" title="Play/Pause">
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
    </svg>
  </div>
  <div class="ctrl-btn" id="nextBtn" title="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </div>
</div>

<div class="mic-row">
  <div class="ctrl-btn mic-btn" id="micBtn" title="Toggle microphone">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </div>
  <div class="audio-level" id="audioLevel">
    <div class="audio-bar" id="audioBar"></div>
  </div>
</div>

<div class="tap-hint">tap card or press → to advance</div>

<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>
<div class="timer-label" id="timerLabel"></div>

<!-- Settings Overlay + Panel -->
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-title">Settings</div>
    <div class="close-btn" id="closePanel">✕</div>
  </div>
  <div class="panel-body">

    <!-- Interval (seconds) -->
    <div class="s-section">
      <div class="s-section-title">Interval (seconds)</div>
      <div class="slider-row">
        <input type="range" id="intervalSlider" min="2" max="30" value="5" step="1">
        <div class="slider-val" id="intervalVal">5s</div>
      </div>
    </div>

    <!-- Root Notes -->
    <div class="s-section">
      <div class="s-section-title">Root Notes</div>
      <div class="chip-actions">
        <button class="chip-action-btn" data-group="notes" data-action="all">All</button>
        <span class="chip-action-sep">·</span>
        <button class="chip-action-btn" data-group="notes" data-action="none">None</button>
      </div>
      <div class="chip-grid" id="notesGrid"></div>
      <div class="warning" id="notesWarn">Select at least one note.</div>
    </div>

    <!-- Accidentals -->
    <div class="s-section">
      <div class="s-section-title">Accidentals</div>
      <div class="chip-grid" id="accidentalsGrid">
        <div class="chip on" data-group="acc" data-val="natural">♮ Natural</div>
        <div class="chip on" data-group="acc" data-val="sharp">♯ Sharp</div>
        <div class="chip on" data-group="acc" data-val="flat">♭ Flat</div>
      </div>
      <div class="warning" id="accWarn">Select at least one accidental type.</div>
    </div>

    <!-- Chord Types (shown in chord mode) -->
    <div class="s-section chord-section" id="chordSection">
      <div class="s-section-title">Chord Types</div>
      <div class="chip-actions">
        <button class="chip-action-btn" data-group="chords" data-action="all">All</button>
        <span class="chip-action-sep">·</span>
        <button class="chip-action-btn" data-group="chords" data-action="none">None</button>
      </div>
      <div class="chip-grid" id="chordsGrid"></div>
      <div class="warning" id="chordsWarn">Select at least one chord type.</div>
    </div>

    <!-- Reset -->
    <div class="s-section">
      <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
