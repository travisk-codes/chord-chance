<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fretboard Flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a34;
    --gold: #c9a84c;
    --gold-dim: #8a6f33;
    --gold-glow: rgba(201,168,76,0.18);
    --text: #e8e4dc;
    --text-dim: #7a7870;
    --red: #c94c4c;
    --green: #4cc97c;
    --radius: 12px;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 180px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  /* Ambient glow behind card */
  .glow-orb {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.5s;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    z-index: 10;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.9;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Mode toggle pill */
  .mode-pill {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .mode-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--gold);
    color: #0d0d0f;
  }
  .mode-btn:not(.active):hover { color: var(--text); }

  /* Settings icon */
  .settings-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-dim);
  }
  .settings-btn:hover { border-color: var(--gold); color: var(--gold); }
  .settings-btn svg { width: 16px; height: 16px; }

  /* ── MAIN CARD ── */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-align: center;
    padding: 20px;
  }

  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .display-wrap {
    position: relative;
  }

  .note-display {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(96px, 18vw, 220px);
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.02em;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s, transform 0.15s;
    position: relative;
    /* text shadow glow */
    text-shadow: 0 0 80px rgba(201,168,76,0.2);
  }

  .note-display.flash-out {
    opacity: 0;
    transform: scale(0.94);
  }
  .note-display.flash-in {
    animation: flashIn 0.3s ease forwards;
  }
  @keyframes flashIn {
    from { opacity: 0; transform: scale(1.04); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Accidental superscript */
  .note-display sup {
    font-size: 0.45em;
    vertical-align: super;
    line-height: 0;
    font-weight: 400;
  }

  /* Chord quality */
  .chord-quality {
    font-family: 'Syne', sans-serif;
    font-weight: 500;
    font-size: clamp(22px, 3.5vw, 42px);
    color: var(--gold);
    letter-spacing: 0.04em;
    margin-top: -8px;
    min-height: 1.4em;
    opacity: 0;
    animation: fadeUp 0.35s 0.1s ease forwards;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 52px;
    position: relative;
    z-index: 1;
  }

  .ctrl-btn {
    width: 48px; height: 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.18s;
    font-size: 0;
  }
  .ctrl-btn svg { width: 18px; height: 18px; }
  .ctrl-btn:hover { border-color: var(--gold); color: var(--gold); }
  .ctrl-btn.primary {
    width: 60px; height: 60px;
    background: var(--gold);
    border-color: var(--gold);
    color: #0d0d0f;
  }
  .ctrl-btn.primary:hover { background: #d4b25e; }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--surface);
    z-index: 5;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    width: 0%;
    transition: none;
    border-radius: 0 2px 2px 0;
  }

  /* ── TIMER DISPLAY ── */
  .timer-label {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    z-index: 5;
    text-transform: uppercase;
  }

  /* ── SETTINGS PANEL ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    backdrop-filter: blur(2px);
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .panel {
    position: fixed;
    top: 0; right: 0;
    width: min(400px, 94vw);
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 55;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .close-btn {
    width: 30px; height: 30px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
    line-height: 1;
  }
  .close-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Settings sections */
  .s-section {
    margin-bottom: 28px;
  }
  .s-section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  /* Interval slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-row input[type=range] {
    flex: 1;
    appearance: none;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    border: none;
  }
  .slider-row input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    border: none;
  }
  .slider-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    min-width: 40px;
    text-align: right;
  }

  /* Chip grid */
  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    letter-spacing: 0.04em;
  }
  .chip:hover { border-color: var(--gold-dim); color: var(--text); }
  .chip.on {
    background: rgba(201,168,76,0.12);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Select all / none */
  .chip-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .chip-action-btn {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0;
    transition: color 0.15s;
  }
  .chip-action-btn:hover { color: var(--gold); }
  .chip-action-sep { color: var(--border); font-size: 10px; line-height: 1.6; }

  /* Warning */
  .warning {
    font-size: 11px;
    color: #c97a4c;
    margin-top: 8px;
    display: none;
  }
  .warning.visible { display: block; }

  /* Chord-only indicator */
  .chord-only-notice {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 10px;
  }

  /* Reset button */
  .reset-btn {
    width: 100%;
    padding: 11px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* Tap hint */
  .tap-hint {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 16px;
    position: relative;
    z-index: 1;
    opacity: 0.7;
  }

  /* Chord section hidden in note mode */
  .chord-section { display: none; }
</style>
</head>
<body>

<div class="glow-orb"></div>

<header>
  <div class="logo">Fretboard Flash</div>
  <div class="header-right">
    <div class="mode-pill">
      <button class="mode-btn active" data-mode="note">Note</button>
      <button class="mode-btn" data-mode="chord">Chord</button>
    </div>
    <div class="settings-btn" id="settingsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
  </div>
</header>

<div class="stage">
  <div class="label" id="modeLabel">Note</div>
  <div class="display-wrap">
    <div class="note-display flash-in" id="noteDisplay">C</div>
  </div>
  <div class="chord-quality" id="chordQuality"></div>
</div>

<div class="controls">
  <div class="ctrl-btn" id="prevBtn" title="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </div>
  <div class="ctrl-btn primary" id="playPauseBtn" title="Play/Pause">
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
    </svg>
  </div>
  <div class="ctrl-btn" id="nextBtn" title="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </div>
</div>

<div class="tap-hint">tap card to advance</div>

<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>
<div class="timer-label" id="timerLabel"></div>

<!-- Settings Overlay + Panel -->
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-title">Settings</div>
    <div class="close-btn" id="closePanel">✕</div>
  </div>
  <div class="panel-body">

    <!-- Interval -->
    <div class="s-section">
      <div class="s-section-title">Interval</div>
      <div class="slider-row">
        <input type="range" id="intervalSlider" min="2" max="30" value="5" step="1">
        <div class="slider-val" id="intervalVal">5s</div>
      </div>
    </div>

    <!-- Root Notes -->
    <div class="s-section">
      <div class="s-section-title">Root Notes</div>
      <div class="chip-actions">
        <button class="chip-action-btn" data-group="notes" data-action="all">All</button>
        <span class="chip-action-sep">·</span>
        <button class="chip-action-btn" data-group="notes" data-action="none">None</button>
      </div>
      <div class="chip-grid" id="notesGrid"></div>
      <div class="warning" id="notesWarn">Select at least one note.</div>
    </div>

    <!-- Accidentals -->
    <div class="s-section">
      <div class="s-section-title">Accidentals</div>
      <div class="chip-grid" id="accidentalsGrid">
        <div class="chip on" data-group="acc" data-val="natural">♮ Natural</div>
        <div class="chip on" data-group="acc" data-val="sharp">♯ Sharp</div>
        <div class="chip on" data-group="acc" data-val="flat">♭ Flat</div>
      </div>
      <div class="warning" id="accWarn">Select at least one accidental type.</div>
    </div>

    <!-- Chord Types (shown in chord mode) -->
    <div class="s-section chord-section" id="chordSection">
      <div class="s-section-title">Chord Types</div>
      <div class="chip-actions">
        <button class="chip-action-btn" data-group="chords" data-action="all">All</button>
        <span class="chip-action-sep">·</span>
        <button class="chip-action-btn" data-group="chords" data-action="none">None</button>
      </div>
      <div class="chip-grid" id="chordsGrid"></div>
      <div class="warning" id="chordsWarn">Select at least one chord type.</div>
    </div>

    <!-- Reset -->
    <div class="s-section">
      <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
    </div>

  </div>
</div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────────────

const ROOT_NOTES = ['C','D','E','F','G','A','B'];

const CHORD_TYPES = [
  { val: 'maj',    label: 'Major',      symbol: '' },
  { val: 'min',    label: 'Minor',      symbol: 'm' },
  { val: '7',      label: 'Dom 7',      symbol: '7' },
  { val: 'maj7',   label: 'Major 7',    symbol: 'maj7' },
  { val: 'min7',   label: 'Minor 7',    symbol: 'm7' },
  { val: 'min7b5', label: 'Half Dim',   symbol: 'm7♭5' },
  { val: 'dim',    label: 'Diminished', symbol: 'dim' },
  { val: 'dim7',   label: 'Dim 7',      symbol: 'dim7' },
  { val: 'aug',    label: 'Augmented',  symbol: 'aug' },
  { val: 'sus2',   label: 'Sus 2',      symbol: 'sus2' },
  { val: 'sus4',   label: 'Sus 4',      symbol: 'sus4' },
  { val: 'add9',   label: 'Add 9',      symbol: 'add9' },
  { val: '9',      label: 'Dom 9',      symbol: '9' },
  { val: 'maj9',   label: 'Major 9',    symbol: 'maj9' },
  { val: 'min9',   label: 'Minor 9',    symbol: 'm9' },
  { val: '6',      label: 'Major 6',    symbol: '6' },
  { val: 'min6',   label: 'Minor 6',    symbol: 'm6' },
  { val: '11',     label: 'Dom 11',     symbol: '11' },
  { val: 'maj11',  label: 'Major 11',   symbol: 'maj11' },
  { val: '13',     label: 'Dom 13',     symbol: '13' },
];

// ─── STATE ─────────────────────────────────────────────────────────────────

const state = {
  mode: 'note',      // 'note' | 'chord'
  playing: false,
  interval: 5,       // seconds
  activeNotes: new Set(ROOT_NOTES),
  activeAcc: new Set(['natural','sharp','flat']),
  activeChords: new Set(CHORD_TYPES.map(c => c.val)),
  current: { root: 'C', acc: '', chord: null },
};

// ─── DERIVED ───────────────────────────────────────────────────────────────

// Maps natural notes that CAN have an accidental form
const SHARP_NOTES  = new Set(['C','D','F','G','A']); // C# D# F# G# A#
const FLAT_NOTES   = new Set(['D','E','G','A','B']); // Db Eb Gb Ab Bb

function buildPool() {
  const pool = [];
  for (const note of ROOT_NOTES) {
    if (!state.activeNotes.has(note)) continue;
    if (state.activeAcc.has('natural')) pool.push({ root: note, acc: '' });
    if (state.activeAcc.has('sharp') && SHARP_NOTES.has(note)) pool.push({ root: note, acc: '#' });
    if (state.activeAcc.has('flat')  && FLAT_NOTES.has(note))  pool.push({ root: note, acc: 'b' });
  }
  return pool;
}

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function nextItem(avoidCurrent = true) {
  const pool = buildPool();
  if (!pool.length) return null;
  const chordPool = [...state.activeChords];
  if (state.mode === 'chord' && !chordPool.length) return null;

  let candidate;
  let tries = 0;
  do {
    candidate = randomFrom(pool);
    tries++;
  } while (
    avoidCurrent &&
    tries < 8 &&
    candidate.root === state.current.root &&
    candidate.acc  === state.current.acc
  );

  let chord = null;
  if (state.mode === 'chord') {
    let chordTries = 0;
    do {
      chord = randomFrom(chordPool);
      chordTries++;
    } while (
      avoidCurrent &&
      chordTries < 8 &&
      chord === state.current.chord
    );
  }

  return { root: candidate.root, acc: candidate.acc, chord };
}

// ─── DOM REFS ──────────────────────────────────────────────────────────────

const noteDisplay   = document.getElementById('noteDisplay');
const chordQuality  = document.getElementById('chordQuality');
const modeLabel     = document.getElementById('modeLabel');
const progressBar   = document.getElementById('progressBar');
const timerLabel    = document.getElementById('timerLabel');
const playPauseBtn  = document.getElementById('playPauseBtn');
const playIcon      = document.getElementById('playIcon');
const pauseIcon     = document.getElementById('pauseIcon');
const prevBtn       = document.getElementById('prevBtn');
const nextBtn       = document.getElementById('nextBtn');
const intervalSlider = document.getElementById('intervalSlider');
const intervalVal   = document.getElementById('intervalVal');
const settingsBtn   = document.getElementById('settingsBtn');
const overlay       = document.getElementById('overlay');
const panel         = document.getElementById('panel');
const closePanel    = document.getElementById('closePanel');
const chordSection  = document.getElementById('chordSection');
const notesWarn     = document.getElementById('notesWarn');
const accWarn       = document.getElementById('accWarn');
const chordsWarn    = document.getElementById('chordsWarn');

// ─── RENDER ────────────────────────────────────────────────────────────────

function renderDisplay(item, animate = true) {
  if (!item) return;
  state.current = item;

  const accChar = item.acc === '#' ? '♯' : item.acc === 'b' ? '♭' : '';
  const inner = accChar
    ? `${item.root}<sup>${accChar}</sup>`
    : item.root;

  if (animate) {
    noteDisplay.classList.add('flash-out');
    setTimeout(() => {
      noteDisplay.innerHTML = inner;
      noteDisplay.classList.remove('flash-out');
      noteDisplay.classList.add('flash-in');
      // reset animation
      void noteDisplay.offsetWidth;
      noteDisplay.classList.remove('flash-in');
      noteDisplay.classList.add('flash-in');

      // chord quality
      if (state.mode === 'chord' && item.chord !== null) {
        const ct = CHORD_TYPES.find(c => c.val === item.chord);
        chordQuality.style.opacity = 0;
        chordQuality.textContent = ct ? ct.symbol : '';
        chordQuality.style.animation = 'none';
        void chordQuality.offsetWidth;
        chordQuality.style.animation = '';
        chordQuality.classList.remove('flash-in');
        void chordQuality.offsetWidth;
        chordQuality.style.opacity = '';
        chordQuality.style.animation = 'fadeUp 0.35s 0.1s ease forwards';
      } else {
        chordQuality.textContent = '';
        chordQuality.style.opacity = '0';
      }
    }, 140);
  } else {
    noteDisplay.innerHTML = inner;
    if (state.mode === 'chord' && item.chord !== null) {
      const ct = CHORD_TYPES.find(c => c.val === item.chord);
      chordQuality.textContent = ct ? ct.symbol : '';
      chordQuality.style.opacity = '1';
    } else {
      chordQuality.textContent = '';
      chordQuality.style.opacity = '0';
    }
  }
}

function updateModeUI() {
  modeLabel.textContent = state.mode === 'note' ? 'Note' : 'Chord';
  // Re-trigger fade animation
  modeLabel.style.animation = 'none';
  void modeLabel.offsetWidth;
  modeLabel.style.animation = '';

  chordSection.style.display = state.mode === 'chord' ? '' : 'none';

  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
}

// ─── TIMER ─────────────────────────────────────────────────────────────────

let timerStart = null;
let rafId = null;
let autoAdvanceTimeout = null;

function startTimer() {
  stopTimer();
  timerStart = performance.now();
  const duration = state.interval * 1000;

  function tick(now) {
    const elapsed = now - timerStart;
    const pct = Math.min((elapsed / duration) * 100, 100);
    progressBar.style.transition = 'none';
    progressBar.style.width = pct + '%';
    const remaining = Math.ceil((duration - elapsed) / 1000);
    timerLabel.textContent = remaining + 's';

    if (elapsed >= duration) {
      advance();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (rafId) cancelAnimationFrame(rafId);
  if (autoAdvanceTimeout) clearTimeout(autoAdvanceTimeout);
  progressBar.style.width = '0%';
  timerLabel.textContent = '';
}

function setPlaying(val) {
  state.playing = val;
  playIcon.style.display  = val ? 'none' : '';
  pauseIcon.style.display = val ? '' : 'none';
  if (val) {
    startTimer();
  } else {
    stopTimer();
    timerLabel.textContent = '';
  }
}

function advance() {
  const item = nextItem();
  if (!item) return;
  renderDisplay(item);
  if (state.playing) startTimer();
}

// ─── HISTORY ───────────────────────────────────────────────────────────────

const history = [];
let histIdx = -1;

function advanceWithHistory() {
  const item = nextItem();
  if (!item) return;
  // truncate forward history
  history.splice(histIdx + 1);
  history.push(item);
  if (history.length > 50) history.shift();
  histIdx = history.length - 1;
  renderDisplay(item);
  if (state.playing) startTimer();
}

function goBack() {
  if (histIdx > 0) {
    histIdx--;
    renderDisplay(history[histIdx]);
    if (state.playing) startTimer();
  }
}

function goForward() {
  if (histIdx < history.length - 1) {
    histIdx++;
    renderDisplay(history[histIdx]);
    if (state.playing) startTimer();
  } else {
    advanceWithHistory();
  }
}

function advance() {
  advanceWithHistory();
}

// Initial item
(function init() {
  const item = nextItem(false);
  if (item) {
    history.push(item);
    histIdx = 0;
    renderDisplay(item, false);
  }
})();

// ─── SETTINGS CHIPS ────────────────────────────────────────────────────────

function buildNotesGrid() {
  const grid = document.getElementById('notesGrid');
  grid.innerHTML = '';
  ROOT_NOTES.forEach(n => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.activeNotes.has(n) ? ' on' : '');
    chip.dataset.group = 'notes';
    chip.dataset.val = n;
    chip.textContent = n;
    grid.appendChild(chip);
  });
}

function buildChordsGrid() {
  const grid = document.getElementById('chordsGrid');
  grid.innerHTML = '';
  CHORD_TYPES.forEach(ct => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.activeChords.has(ct.val) ? ' on' : '');
    chip.dataset.group = 'chords';
    chip.dataset.val = ct.val;
    chip.textContent = ct.label + (ct.symbol ? ` (${ct.symbol})` : '');
    grid.appendChild(chip);
  });
}

buildNotesGrid();
buildChordsGrid();

// Chip click delegation
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-group]');
  if (!chip) return;
  const group = chip.dataset.group;
  const val   = chip.dataset.val;

  if (group === 'notes') {
    if (state.activeNotes.has(val)) {
      if (state.activeNotes.size <= 1) { notesWarn.classList.add('visible'); return; }
      state.activeNotes.delete(val);
    } else {
      state.activeNotes.add(val);
    }
    notesWarn.classList.remove('visible');
    buildNotesGrid();
  } else if (group === 'acc') {
    if (state.activeAcc.has(val)) {
      if (state.activeAcc.size <= 1) { accWarn.classList.add('visible'); return; }
      state.activeAcc.delete(val);
    } else {
      state.activeAcc.add(val);
    }
    accWarn.classList.remove('visible');
    // update acc chips
    document.querySelectorAll('.chip[data-group="acc"]').forEach(c => {
      c.classList.toggle('on', state.activeAcc.has(c.dataset.val));
    });
  } else if (group === 'chords') {
    if (state.activeChords.has(val)) {
      if (state.activeChords.size <= 1) { chordsWarn.classList.add('visible'); return; }
      state.activeChords.delete(val);
    } else {
      state.activeChords.add(val);
    }
    chordsWarn.classList.remove('visible');
    buildChordsGrid();
  }
});

// Select all / none
document.addEventListener('click', e => {
  const btn = e.target.closest('.chip-action-btn[data-group]');
  if (!btn) return;
  const group  = btn.dataset.group;
  const action = btn.dataset.action;

  if (group === 'notes') {
    if (action === 'all') ROOT_NOTES.forEach(n => state.activeNotes.add(n));
    else { state.activeNotes.clear(); state.activeNotes.add(ROOT_NOTES[0]); }
    notesWarn.classList.remove('visible');
    buildNotesGrid();
  } else if (group === 'chords') {
    if (action === 'all') CHORD_TYPES.forEach(c => state.activeChords.add(c.val));
    else { state.activeChords.clear(); state.activeChords.add(CHORD_TYPES[0].val); }
    chordsWarn.classList.remove('visible');
    buildChordsGrid();
  }
});

// ─── INTERVAL SLIDER ───────────────────────────────────────────────────────

intervalSlider.addEventListener('input', () => {
  state.interval = parseInt(intervalSlider.value);
  intervalVal.textContent = state.interval + 's';
  if (state.playing) startTimer(); // reset timer with new duration
});

// ─── MODE BUTTONS ──────────────────────────────────────────────────────────

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === state.mode) return;
    state.mode = btn.dataset.mode;
    updateModeUI();
    const item = nextItem(false);
    if (item) {
      history.length = 0;
      history.push(item);
      histIdx = 0;
      renderDisplay(item);
    }
    if (state.playing) startTimer();
  });
});

// ─── PLAY / PAUSE ──────────────────────────────────────────────────────────

playPauseBtn.addEventListener('click', () => setPlaying(!state.playing));

// ─── PREV / NEXT ───────────────────────────────────────────────────────────

prevBtn.addEventListener('click', () => { goBack(); });
nextBtn.addEventListener('click', () => { goForward(); });

// ─── TAP CARD ──────────────────────────────────────────────────────────────

noteDisplay.addEventListener('click', () => goForward());

// ─── SETTINGS PANEL ────────────────────────────────────────────────────────

function openPanel() {
  overlay.classList.add('open');
  panel.classList.add('open');
}
function closeSettingsPanel() {
  overlay.classList.remove('open');
  panel.classList.remove('open');
}

settingsBtn.addEventListener('click', openPanel);
overlay.addEventListener('click', closeSettingsPanel);
closePanel.addEventListener('click', closeSettingsPanel);

// ─── RESET ─────────────────────────────────────────────────────────────────

document.getElementById('resetBtn').addEventListener('click', () => {
  state.interval = 5;
  intervalSlider.value = 5;
  intervalVal.textContent = '5s';
  state.activeNotes = new Set(ROOT_NOTES);
  state.activeAcc   = new Set(['natural','sharp','flat']);
  state.activeChords = new Set(CHORD_TYPES.map(c => c.val));
  buildNotesGrid();
  buildChordsGrid();
  document.querySelectorAll('.chip[data-group="acc"]').forEach(c => c.classList.add('on'));
  [notesWarn, accWarn, chordsWarn].forEach(w => w.classList.remove('visible'));
});

// ─── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (panel.classList.contains('open')) return;
  if (e.code === 'Space')      { e.preventDefault(); setPlaying(!state.playing); }
  if (e.code === 'ArrowRight') goForward();
  if (e.code === 'ArrowLeft')  goBack();
});
</script>
</body>
</html>
